<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="style.css" rel="stylesheet" type="text/css">
  <script src="script.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <title>Document</title>
</head>
<body>
  <header>
    <img src="C:\Users\49006614\Documents\GitHub\proyecto-NEIA\Millie (Front y Back)\Usuario.png" class="iniciosesion">

    <div class="centro">
      <h1>NEIA</h1>
      <img src="C:\Users\49006614\Documents\GitHub\proyecto-NEIA\Millie (Front y Back)\inteligencia-artificial.png" class="logoHeader">
    </div>
  </header>

  <div id="modalSesion" class="modal">
    <div class="modal-contenido">
      <span class="cerrar">&times;</span>

      <div id="formRegistro" class="formulario activo">
        <h2>Registrarse</h2>
        <form>
          <input type="text" placeholder="Nombre de usuario" required>
          <input type="email" placeholder="Correo electrónico" required>
          <input type="password" placeholder="Contraseña" required>
          <button type="submit" class="btn">Crear cuenta</button>
        </form>
        <p class="cambio">¿Ya tienes una cuenta? <span id="mostrarLogin">Iniciar sesión</span></p>
      </div>

      <div id="formLogin" class="formulario">
        <h2>Iniciar sesión</h2>
        <form>
          <input type="text" placeholder="Nombre de usuario" required>
          <input type="password" placeholder="Contraseña" required>
          <button type="submit" class="btn">Entrar</button>
        </form>
        <p class="cambio">¿No tienes una cuenta? <span id="mostrarRegistro">Registrarse</span></p>
      </div>
    </div>
  </div>

  <div class="upload-box" onclick="abrirInputArchivo(event)">
    <img class="icono" src="C:\Users\49006614\Documents\GitHub\proyecto-NEIA\Millie (Front y Back)\cargarimagen.png" alt="Upload">
    <span id="fileName" class="preview"></span>
    <button id="removeBtn" class="remove-btn" onclick="eliminarArchivo(event)">×</button>
    <input type="file" id="fileInput" style="display: none;">
  </div>

  <button id="btnHistorial" class="btnHistorial" style="display: none;">HISTORIAL</button>

  <div id="modalHistorial" class="modal-historial">
    <div class="historial-contenido">
      <span class="cerrar-historial">&times;</span>
      <h2>Historial de Análisis</h2>
      <div id="historialLista" class="historial-lista"></div>
    </div>
  </div>

  <!-- 🔹 NUEVO MODAL DE CONFIRMACIÓN -->
  <div id="modalConfirmacion" class="modal-confirmacion">
    <div class="confirmacion-contenido">
      <h2>¿Deseas guardar la información en tu historial?</h2>
      <div class="botones-confirmacion">
        <button id="btnGuardar" class="btn violeta">Guardar</button>
        <button id="btnNoGuardar" class="btn blanco">No guardar</button>
      </div>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" style="display: none" onchange="mostrarImagen(event)">

  <div class="boton">
    <button class="botonIniciar">ANALIZAR</button>
  </div>

  <div class="persona">
    <h2>La persona quiere decir: </h2>
  </div>

  <div class="resultado">
    <h2>(resultado)</h2>
  </div>
</body>
</html>
